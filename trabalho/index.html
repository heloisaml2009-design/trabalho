
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LingoWorld - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>

<body>
  <div class="pagina inicial">
        <a href="home.html" class="perfil">
            
        </a>

    </div> 
    <header>
        <div class="logo">🌎 LingoWorld</div>
    </header>

    <main class="container">

        <section class="login-box">

            <div class="icon">📚</div>

            <h1>Bem-vindo!</h1>

            <p class="description">
                Entre na sua conta e comece a aprender novos idiomas.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                        minlength="4"
                    >
                </div>

                <button id="cadastro">cadastro</button> <type="submit">
                    Entrar na minha conta →
                </button>

                <p id="mensagem"></p>

            </form>

            <div class="divider">
                <span>OU</span>
            </div>

            <p class="register">
                Ainda não tem uma conta?
                <a href="#" id="cadastroLink">Cadastre-se</a>
            </p>

            <p class="footer-text">
                🌟 Aprenda um idioma novo todos os dias!
            </p>

        </section>

    </main>

</body>
</html>
